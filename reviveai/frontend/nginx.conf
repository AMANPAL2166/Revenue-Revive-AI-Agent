server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback: any path that isn't a real file goes to index.html
        # so React Router can handle client-side routes like
        # /recovery-cases/:id directly, including on a hard refresh.
        try_files $uri $uri/ /index.html;
    }
}
